<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AFI 画像生成</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>AFI</h1>
    <button id="openSettings" class="icon-btn" aria-label="設定">⚙︎</button>
  </header>

  <main>
    <section class="composer">
      <textarea id="prompt" rows="4" placeholder="作りたい画像を説明してください（例：夕焼けの海辺を歩く柴犬、水彩画風）"></textarea>

      <div class="row">
        <label class="field">
          <span>サービス</span>
          <select id="provider">
            <option value="pollinations">Pollinations（無料）</option>
            <option value="openai">OpenAI</option>
            <option value="gemini">Google Imagen</option>
          </select>
        </label>
        <label class="field small">
          <span>枚数</span>
          <select id="count">
            <option>1</option><option>2</option><option>3</option><option>4</option>
          </select>
        </label>
      </div>

      <div class="chips" id="aspect" role="radiogroup" aria-label="縦横比">
        <button data-v="1:1" class="chip active">1:1</button>
        <button data-v="3:4" class="chip">3:4</button>
        <button data-v="9:16" class="chip">9:16</button>
        <button data-v="4:3" class="chip">4:3</button>
        <button data-v="16:9" class="chip">16:9</button>
      </div>

      <button id="generate" class="primary">生成する</button>
      <p id="status" class="status" role="status"></p>
    </section>

    <section>
      <div class="gallery-head">
        <h2>ギャラリー</h2>
        <button id="clearAll" class="text-btn">すべて削除</button>
      </div>
      <div id="gallery" class="gallery"></div>
      <p id="empty" class="empty">まだ画像がありません</p>
    </section>
  </main>

  <dialog id="viewer">
    <img id="viewerImg" alt="" />
    <p id="viewerPrompt" class="viewer-prompt"></p>
    <div class="viewer-actions">
      <button id="vShare">共有</button>
      <button id="vSave">保存</button>
      <button id="vReuse">プロンプト再利用</button>
      <button id="vDelete" class="danger">削除</button>
      <button id="vClose">閉じる</button>
    </div>
  </dialog>

  <dialog id="settings">
    <form method="dialog" class="settings-form">
      <h2>設定</h2>
      <p class="note">APIキーはこの端末のブラウザ内にのみ保存され、各サービスへ直接送信されます。</p>
      <label class="field"><span>OpenAI APIキー</span><input id="openaiKey" type="password" autocomplete="off" placeholder="sk-..." /></label>
      <label class="field"><span>OpenAI モデル</span><input id="openaiModel" type="text" /></label>
      <label class="field"><span>Gemini APIキー</span><input id="geminiKey" type="password" autocomplete="off" placeholder="AIza..." /></label>
      <label class="field"><span>Imagen モデル</span><input id="geminiModel" type="text" /></label>
      <div class="viewer-actions"><button value="save" class="primary">保存</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
